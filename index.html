<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle City Tycoon</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* Phone Frame Design */
        .phone-frame {
            width: 100%;
            max-width: 400px;
            background: #161b22;
            padding: 20px;
            border-radius: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 4px solid #30363d;
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            color: #58a6ff;
            font-size: 1.5rem;
            margin-top: 5px;
        }
        h2 {
            color: #3fb950;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        .container {
            background: #21262d;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.1);
        }
        .stats {
            font-size: 1rem;
            margin: 10px 0;
            background: #30363d;
            padding: 10px;
            border-radius: 8px;
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px 0;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2ea043;
        }
        button:disabled {
            background-color: #484f58;
            cursor: not-allowed;
            color: #8b949e;
        }
        .ad-button {
            background-color: #8957e5;
        }
        .ad-button:hover {
            background-color: #a371f7;
        }
        .shop-item {
            display: flex;
            flex-direction: column;
            background: #30363d;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            text-align: right;
        }
        .shop-item span {
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        .hidden {
            display: none;
        }
        #message {
            color: #d29922;
            font-size: 0.9rem;
            font-weight: bold;
            min-height: 35px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <h1>Idle City Tycoon</h1>
        <div id="message">Welcome! Start working to earn your first cash.</div>
        
        <div class="container stats">
            <div>Cash: <strong>$<span id="money">0</span></strong></div>
            <div>Income: <strong>$<span id="cps">0</span>/sec</strong></div>
            <div>Status: <span id="status">Regular Citizen</span></div>
        </div>

        <!-- Working Section -->
        <div class="container" id="work-section">
            <button onclick="work()">Work Hard & Earn Cash</button>
        </div>

        <!-- Ad Rewards Section -->
        <div class="container">
            <button class="ad-button" onclick="watchAd()">📺 Watch Ad for +$500 Cash</button>
        </div>

        <!-- Jobs Section -->
        <div id="jobs-section" class="container hidden">
            <h2>Job Market</h2>
            <div id="jobs-list"></div>
        </div>

        <!-- Businesses Section -->
        <div id="business-section" class="container hidden">
            <h2>Your Businesses</h2>
            <div id="businesses-list"></div>
        </div>

        <!-- City Section -->
        <div id="city-section" class="container hidden">
            <h2>Your City ("New Haven")</h2>
            <div id="city-list"></div>
        </div>
    </div>

    <script>
        let game = {
            money: 0,
            cps: 0,
            jobLevel: 0,
            businesses: { kiosk: 0, store: 0, factory: 0 },
            cityBuildings: { houses: 0, park: 0, skyscraper: 0 }
        };

        const jobs = [
            { name: "Restaurant Dishwasher", pay: 1, cost: 0, unlocked: true },
            { name: "Convenience Store Clerk", pay: 5, cost: 100, unlocked: false },
            { name: "Shift Manager", pay: 20, cost: 500, unlocked: false }
        ];

        const businessesData = {
            kiosk: { name: "Neighborhood Kiosk", cost: 1000, income: 10 },
            store: { name: "Supermarket", cost: 7500, income: 60 },
            factory: { name: "Tech Factory", cost: 40000, income: 300 }
        };

        const cityData = {
            houses: { name: "Residential Area", cost: 100000, income: 1000 },
            park: { name: "City Park", cost: 500000, income: 5000 },
            skyscraper: { name: "Mega Commercial Center", cost: 2500000, income: 25000 }
        };

        function updateUI() {
            document.getElementById('money').innerText = Math.floor(game.money).toLocaleString();
            document.getElementById('cps').innerText = game.cps.toLocaleString();
            
            if (game.money >= 50 || game.jobLevel > 0) {
                document.getElementById('jobs-section').classList.remove('hidden');
                renderJobs();
            }
            if (game.money >= 800 || totalBusinesses() > 0) {
                document.getElementById('business-section').classList.remove('hidden');
                renderBusinesses();
            }
            if (game.money >= 80000 || totalCity() > 0) {
                document.getElementById('city-section').classList.remove('hidden');
                renderCity();
            }

            updateStatusText();
        }

        function totalBusinesses() {
            return Object.values(game.businesses).reduce((a, b) => a + b, 0);
        }

        function totalCity() {
            return Object.values(game.cityBuildings).reduce((a, b) => a + b, 0);
        }

        function work() {
            let currentPay = jobs[game.jobLevel].pay;
            game.money += currentPay;
            updateUI();
        }

        function watchAd() {
            document.getElementById('message').innerText = "Simulating Ad... Enjoying your reward!";
            setTimeout(() => {
                game.money += 500;
                document.getElementById('message').innerText = "Ad finished! You received +$500!";
                updateUI();
            }, 1000);
        }

        function renderJobs() {
            let html = '';
            jobs.forEach((job, index) => {
                if (game.money >= job.cost / 2 || index <= game.jobLevel) {
                    let isCurrent = game.jobLevel === index;
                    html += `<div class="shop-item">
                        <span><b>${job.name}</b> (Pay: $${job.pay}/click)</span>
                        <button ${isCurrent ? 'disabled' : ''} onclick="setJob(${index})">${isCurrent ? 'Current Job' : 'Work Here'}</button>
                    </div>`;
                }
            });
            document.getElementById('jobs-list').innerHTML = html;
        }

        function setJob(index) {
            game.jobLevel = index;
            document.getElementById('message').innerText = `Switched job to: ${jobs[index].name}!`;
            updateUI();
        }

        function renderBusinesses() {
            let html = '';
            for (let key in businessesData) {
                let biz = businessesData[key];
                html += `<div class="shop-item">
                    <span><b>${biz.name}</b> (Owned: ${game.businesses[key]})<br>Cost: $${biz.cost.toLocaleString()} | +${biz.income}/sec</span>
                    <button onclick="buyBusiness('${key}')">Buy Business</button>
                </div>`;
            }
            document.getElementById('businesses-list').innerHTML = html;
        }

        function buyBusiness(key) {
            let biz = businessesData[key];
            if (game.money >= biz.cost) {
                game.money -= biz.cost;
                game.businesses[key]++;
                game.cps += biz.income;
                biz.cost = Math.floor(biz.cost * 1.15);
                document.getElementById('message').innerText = `Successfully purchased ${biz.name}!`;
                updateUI();
            } else {
                document.getElementById('message').innerText = "Not enough cash for this business.";
            }
        }

        function renderCity() {
            let html = '';
            for (let key in cityData) {
                let building = cityData[key];
                html += `<div class="shop-item">
                    <span><b>${building.name}</b> (Built: ${game.cityBuildings[key]})<br>Cost: $${building.cost.toLocaleString()} | +${building.income}/sec</span>
                    <button onclick="buyCityBuilding('${key}')">Build</button>
                </div>`;
            }
            document.getElementById('city-list').innerHTML = html;
        }

        function buyCityBuilding(key) {
            let building = cityData[key];
            if (game.money >= building.cost) {
                game.money -= building.cost;
                game.cityBuildings[key]++;
                game.cps += building.income;
                building.cost = Math.floor(building.cost * 1.2);
                document.getElementById('message').innerText = `Built new city block: ${building.name}!`;
                updateUI();
            } else {
                document.getElementById('message').innerText = "Urban real estate requires more capital!";
            }
        }

        function updateStatusText() {
            let status = "Regular Citizen";
            if (totalCity() > 0) status = "Mayor & Metropolis Founder";
            else if (totalBusinesses() > 0) status = "Business Owner & Entrepreneur";
            else if (game.jobLevel > 0) status = "Advanced Employee";
            document.getElementById('status').innerText = status;
        }

        setInterval(() => {
            if (game.cps > 0) {
                game.money += game.cps / 10;
                updateUI();
            }
        }, 100);

        updateUI();
    </script>
</body>
</html>
