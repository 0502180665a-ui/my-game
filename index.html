<script>

/* =========================================================
   INITIALIZE
========================================================= */

function init(){

    loadGame();

    );

    clock=new THREE.Clock();

}

/* =========================================================
   LIGHTING
========================================================= */

function createLighting(){

        .65

}

/* =========================================================
   WORLD
========================================================= */

function createWorld(){

    const groundGeometry=
        new THREE.PlaneGeometry(
            150,
            150
        );

    const groundMaterial=
        new THREE.MeshStandardMaterial({
            color:0x4b7049
        });

    const ground=
        new THREE.Mesh(
            groundGeometry,
            groundMaterial
        );

    ground.rotation.x=-Math.PI/2;

    ground.receiveShadow=true;

    scene.add(ground);

    /* Road */

    const roadMaterial=
        new THREE.MeshStandardMaterial({
            color:0x33383f
        });

    const road=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                100,
                .05,
                8
            ),
            roadMaterial
        );

    road.position.set(
        0,
        .02,
        15
    );

    scene.add(road);

    /* Trees */

    for(let i=0;i<20;i++){

        const x=
            Math.random()*100-50;

        const z=
            Math.random()*100-50;

        createTree(x,z);
    }
}

function createTree(x,z){

function createWall(

/* =========================================================
   ROOMS
========================================================= */

function createRooms(){

    for(
        let i=0;
        i<game.rooms;
        i++
    ){

        createRoom(
            i
        );
    }
}

function createRoom(index){

    let pos;

    if(index<roomPositions.length){

        pos=roomPositions[index];

    }else{

        const row=
            Math.floor(index/5);

        const col=
            index%5;

        pos={
            x:-7+col*5,
            z:-7-row*5
        };
    }

    const room=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4.5,
                3,
                4
            ),
            new THREE.MeshStandardMaterial({
                color:0x687c94
            })
        );

    room.position.set(
        pos.x,
        1.5,
        pos.z
    );

    room.castShadow=true;

    scene.add(room);

    room.userData={
        type:"room",
        room:index,
        dirty:false
    };

    roomObjects.push(room);

    /* Bed */

    const bed=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.2,
                .6,
                1.8
            ),
            new THREE.MeshStandardMaterial({
                color:0xf0eeee
            })
        );

    bed.position.set(

        .45,
        pos.z
    );

    scene.add(bed);

    /* Door */

    const door=

}

/* =========================================================
   TEXT SPRITE
========================================================= */

function createTextSprite(text){

    const canvas=
        document.createElement(
            "canvas"
        );

    canvas.width=512;
    canvas.height=128;

    const ctx=
        canvas.getContext("2d");

    ctx.fillStyle=
        "rgba(20,25,35,.85)";

    ctx.fillRect(
        0,
        0,
        512,
        128
    );

    ctx.fillStyle="white";

    ctx.font="bold 48px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        text,
        256,
        80
    );

    const texture=
        new THREE.CanvasTexture(
            canvas
        );

    const material=
        new THREE.SpriteMaterial({
            map:texture,
            transparent:true
        });

    return new THREE.Sprite(
        material
    );
}

   CUSTOMER
========================================================= */

function spawnCustomer(){

    const customer=
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .35,

                8
            ),
            new THREE.MeshStandardMaterial({

                    Math.random()>.5
                    ?0x3866a8
                    :0xa84949
            })
        );

        -2,
        .9,
        15
    );

    customer.castShadow=true;

    scene.add(customer);

    const data={
        object:customer,

    };

    customers.push(data);

    game.guests++;

    updateUI();
}

/* =========================================================
   CUSTOMER MOVEMENT
========================================================= */

function updateCustomers(delta){

    customers.forEach(customer=>{

        const obj=
            customer.object;

        if(
            customer.state===
            "walkingToReception"
        ){

            moveObjectTo(
                obj,
                0,
                3,
                delta
            );

            if(
                distance(
                    obj.position.x,
                    obj.position.z,
                    0,
                    3
                )<.8
            ){

                customer.state=
                    "waitingForCheckin";

                notify(
                    "🛎️ A guest is waiting at reception!"
                );
            }

        }

        else if(
            customer.state===
            "walkingToRoom"
        ){

            const room=
                getRoomPosition(
                    customer.targetRoom
                );

            moveObjectTo(
                obj,
                room.x,
                room.z,
                delta
            );

            if(
                distance(
                    obj.position.x,
                    obj.position.z,
                    room.x,
                    room.z
                )<.8
            ){

                customer.state=
                    "staying";

                customer.timer=
                    35;

                notify(
                    "🛏️ Guest entered Room " +
                    (customer.targetRoom+1)
                );
            }
        }

        else if(
            customer.state===
            "staying"
        ){

            customer.timer-=delta;

            if(
                customer.timer<=0
            ){

                customer.state=
                    "leaving";

                const room=
                    getRoomPosition(
                        customer.targetRoom
                    );

                /* Make room dirty */

                game.roomStates[
                    customer.targetRoom
                ]="dirty";

                game.cleanRooms=
                    Math.max(
                        0,
                        game.cleanRooms-1
                    );

                /* Guest pays */

                if(!customer.paid){

                    customer.paid=true;

                    addMoney(
                        game.roomPrice
                    );

                    notify(
                        "💵 Guest checked out! +" +
                        formatMoney(
                            game.roomPrice
                        )
                    );
                }
            }
        }

        else if(
            customer.state===
            "leaving"
        ){

            moveObjectTo(
                obj,
                0,
                15,
                delta
            );

            if(
                obj.position.z>14
            ){

                scene.remove(obj);

                customer.state=
                    "gone";
            }
        }

    });

    customers=
        customers.filter(
            c=>c.state!=="gone"
        );
}

/* =========================================================
   CHECK-IN
========================================================= */

function checkInNearestCustomer(){

    let nearest=null;

    let nearestDistance=999;

    customers.forEach(customer=>{

        if(
            customer.state===
            "waitingForCheckin"
        ){

            const d=
                distance(
                    player.x,
                    player.z,
                    customer.object.position.x,
                    customer.object.position.z
                );

            if(
                d<nearestDistance
            ){

                nearestDistance=d;
                nearest=customer;
            }
        }

    });

    if(
        nearest &&
        nearestDistance<4
    ){

        let room=
            findCleanRoom();

        if(room===-1){

            notify(
                "❌ No clean rooms available!"
            );

            return;
        }

        nearest.targetRoom=room;

        nearest.state=
            "walkingToRoom";

        notify(
            "🛎️ Check-in complete! Guest is going to Room " +
            (room+1)
        );

        updateObjective(
            "Follow your guest to their room."
        );

    }else{

        notify(
            "You need to stand near the reception guest."
        );
    }
}

/* =========================================================
   CLEANING
========================================================= */

function cleanRoom(){

    let nearest=-1;
    let best=999;

    for(
        let i=0;
        i<game.rooms;
        i++
    ){

        if(
            game.roomStates[i]==="dirty"
        ){

            const pos=
                getRoomPosition(i);

            const d=
                distance(
                    player.x,
                    player.z,
                    pos.x,
                    pos.z
                );

            if(
                d<best
            ){

                best=d;
                nearest=i;
            }
        }
    }

    if(
        nearest!==-1 &&
        best<4
    ){

        game.roomStates[
            nearest
        ]="clean";

        game.cleanRooms++;

        game.reputation=
            Math.min(
                5,
                game.reputation+.02
            );

        notify(
            "🧹 Room " +
            (nearest+1) +
            " cleaned!"
        );

        updateObjective(
            "Return to reception and wait for another guest."
        );

        updateUI();

    }else{

        notify(
            "There are no dirty rooms nearby."
        );
    }
}

/* =========================================================
   ROOM HELPERS
========================================================= */

function getRoomPosition(index){

    if(
        index<roomPositions.length
    ){

        return roomPositions[index];
    }

    const row=
        Math.floor(index/5);

    const col=
        index%5;

    return {
        x:-7+col*5,
        z:-7-row*5
    };
}

function findCleanRoom(){

    for(
        let i=0;
        i<game.rooms;
        i++
    ){

        if(
            !game.roomStates[i] ||
            game.roomStates[i]==="clean"
        ){

            return i;
        }
    }

    return -1;
}

/* =========================================================
   MOVEMENT
========================================================= */

function moveObjectTo(
    object,
    tx,
    tz,
    delta
){

    const dx=
        tx-object.position.x;

    const dz=
        tz-object.position.z;

    const length=
        Math.sqrt(
            dx*dx+
            dz*dz
        );

    if(length<.01)
        return;

    object.position.x +=
        dx/length *
        2 *
        delta;

    object.position.z +=
        dz/length *
        2 *
        delta;

    object.lookAt(
        tx,
        object.position.y,
        tz
    );
}

/* =========================================================
   CONTROLS
========================================================= */

function setupControls(){

    document.addEventListener(
        "keydown",
        e=>{
            keys[e.code]=true;

            if(e.code==="KeyE"){
                interact();
            }
        }
    );

    document.addEventListener(
        "keyup",
        e=>{
            keys[e.code]=false;
        }
    );

    document.addEventListener(
        "click",
        ()=>{
            if(
                !firstPersonLocked
            ){

                document.body.requestPointerLock();

                firstPersonLocked=true;

                document.getElementById(
                    "locked"
                ).style.display="none";
            }
        }
    );

    document.addEventListener(
        "mousemove",
        e=>{

            if(
                document.pointerLockElement
                !==document.body
            )
                return;

            camera.rotation.y
                -= e.movementX*.002;

            camera.rotation.x
                -= e.movementY*.002;

            camera.rotation.x=
                Math.max(
                    -Math.PI/2+.1,
                    Math.min(
                        Math.PI/2-.1,
                        camera.rotation.x
                    )
                );
        }
    );

    window.addEventListener(
        "resize",
        ()=>{
            camera.aspect=
                window.innerWidth/
                window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        }
    );
}

/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(delta){

    let forward=0;
    let right=0;

    if(keys["KeyW"])
        forward+=1;

    if(keys["KeyS"])
        forward-=1;

    if(keys["KeyD"])
        right+=1;

    if(keys["KeyA"])
        right-=1;

    if(
        forward===0 &&
        right===0
    )
        return;

    const speed=
        player.speed*delta;

    const direction=
        new THREE.Vector3();

    camera.getWorldDirection(
        direction
    );

    direction.y=0;

    direction.normalize();

    const rightVector=
        new THREE.Vector3(
            -direction.z,
            0,
            direction.x
        );

    camera.position.x +=
        direction.x *
        forward *
        speed;

    camera.position.z +=
        direction.z *
        forward *
        speed;

    camera.position.x +=
        rightVector.x *
        right *
        speed;

    camera.position.z +=
        rightVector.z *
        right *
        speed;

    /* Hotel boundary */

    camera.position.x=
        Math.max(
            -11,
            Math.min(
                17,
                camera.position.x
            )
        );

    camera.position.z=
        Math.max(
            -11,
            Math.min(
                6,
                camera.position.z
            )
        );

    player.x=
        camera.position.x;

    player.z=
        camera.position.z;
}

    let receptionDistance=
        distance(

        receptionDistance<4

        checkInNearestCustomer();

/* =========================================================
   INTERACTION UI
========================================================= */

function updateInteraction(){

    const ui=
        document.getElementById(
            "interaction"
        );

    let receptionGuest=false;

    customers.forEach(c=>{

        if(
            c.state===
            "waitingForCheckin"
        ){

            const d=
                distance(
                    player.x,
                    player.z,
                    c.object.position.x,
                    c.object.position.z
                );

            if(d<4)
                receptionGuest=true;
        }

    });

    if(receptionGuest){

        ui.style.display="block";

        ui.innerHTML=
            "Press <b>E</b> to Check In Guest";

        return;
    }

    /* Dirty room */

    for(
        let i=0;
        i<game.rooms;
        i++
    ){

        if(
            game.roomStates[i]==="dirty"
        ){

            const pos=
                getRoomPosition(i);

            if(
                distance(
                    player.x,
                    player.z,
                    pos.x,
                    pos.z
                )<4
            ){

                ui.style.display="block";

                ui.innerHTML=
                    "Press <b>E</b> to Clean Room";

                return;
            }
        }
    }

    ui.style.display="none";
}

/* =========================================================
   FORMAT
========================================================= */

function formatMoney(n){

    if(
        n>=1000000
    )
        return "$"+
            (n/1000000)
            .toFixed(2)+"M";

    if(
        n>=1000
    )
        return "$"+
            (n/1000)
            .toFixed(1)+"K";

    return "$"+
        Math.floor(n);
}

/* =========================================================
   DISTANCE
========================================================= */

function distance(
    x1,
    z1,
    x2,
    z2
){

    const dx=x1-x2;
    const dz=z1-z2;

    return Math.sqrt(
        dx*dx+
        dz*dz
    );
}

    const box=
        document.getElementById(
            "message"
        );

    box.innerText=text;

    box.style.display="block";

    clearTimeout(
        messageTimeout
    );

    messageTimeout=
        setTimeout(
            ()=>{
                box.style.display="none";
            },
            3500
        );
}

    );

function loadGame(){

    const save=
        localStorage.getItem(
            "hotelEmpireFPS"
        );

    if(!save){

        for(
            let i=0;
            i<game.rooms;
            i++
        )
            game.roomStates[i]="clean";

        return;
    }

    try{

        const loaded=
            JSON.parse(save);

        game=loaded;

        if(
            !game.roomStates
        )
            game.roomStates=[];

    }catch(e){

        console.log(
            "Could not load save."
        );
    }
}
