<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hotel Empire - Prototype</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
#game{width:100vw;height:100vh;position:relative;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:12px;left:12px;background:rgba(18,22,28,.9);color:#fff;padding:12px 16px;border-radius:14px;z-index:3}
#money{font-size:24px;color:#70ef8a;font-weight:800}
#task{position:absolute;right:12px;top:12px;background:rgba(18,22,28,.9);color:white;padding:12px 16px;border-radius:14px;max-width:280px;z-index:3}
#joystick{position:absolute;left:20px;bottom:20px;width:125px;height:125px;border-radius:50%;background:rgba(30,35,42,.55);border:2px solid rgba(255,255,255,.3);z-index:4;touch-action:none}
#knob{position:absolute;width:56px;height:56px;border-radius:50%;left:33px;top:33px;background:#eee;box-shadow:0 4px 12px #0008}
#action{position:absolute;right:22px;bottom:28px;width:78px;height:78px;border:0;border-radius:50%;background:#3473d5;color:#fff;font-weight:800;z-index:4}
#tip{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#000a;color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;z-index:3}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>
<div id="hud"><div id="money">$100</div><div>Guests: <span id="guests">0</span> · Rooms: <span id="rooms">5</span></div><div>⭐ <span id="rep">1.0</span> · Hotel Worker</div></div>
<div id="task">Your hotel is opening. Wait for guests.</div>
<div id="joystick"><div id="knob"></div></div>
<button id="action">E<br>INTERACT</button>
<div id="tip">Drag the joystick • WASD + E on PC</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8eb0c2);
scene.fog=new THREE.Fog(0x8eb0c2,35,85);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,200);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x55704e,1.5));
const sun=new THREE.DirectionalLight(0xffffff,2.0); sun.position.set(15,30,12); sun.castShadow=true; scene.add(sun);

const mat=(color,rough=.8)=>new THREE.MeshStandardMaterial({color,roughness:rough});
const floorMat=mat(0xcbbd9f), wallMat=mat(0xe8e1d5), wood=mat(0x754b30), carpet=mat(0x8e2028), blue=mat(0x4b86c5);

function box(x,y,z,sx,sy,sz,m,sceneTo=scene){
 const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m); o.position.set(x,y,z); o.castShadow=true;o.receiveShadow=true;sceneTo.add(o);return o;
}
function cyl(x,y,z,r,h,m){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),m);o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o;}

box(0,-.15,0,48,.3,34,floorMat);
box(0,3,-17,48,6,.5,wallMat);
box(-24,3,0,.5,6,34,wallMat); box(24,3,0,.5,6,34,wallMat);
box(-13,3,16,18,6,.5,wallMat); box(13,3,16,18,6,.5,wallMat);
box(0,3,16,8,6,.5,wallMat); // entrance framing

// red carpet
box(0,.03,10,7,.05,18,carpet);

// reception desk
box(0,1,4.5,8,.9,1.8,wood);
box(0,1.9,4.5,6,.15,.25,mat(0xd3a967));

// rooms: left/right, with real wall sections and door gaps
const rooms=[];
function makeRoom(x,z,n){
 const W=10,D=8;
 // back wall
 box(x,3,z-D/2,W,6,.35,wallMat);
 // side walls
 box(x-W/2,3,z,.35,6,D,wallMat);
 box(x+W/2,3,z,.35,6,D,wallMat);
 // front wall pieces, leaving a real door gap
 box(x-3.2,3,z+D/2,W-6.4,6,.35,wallMat);
 box(x+3.2,3,z+D/2,W-6.4,6,.35,wallMat);
 // door frame
 box(x-1.25,1.7,z+D/2,.22,3.4,.5,wood);
 box(x+1.25,1.7,z+D/2,.22,3.4,.5,wood);
 // furniture
 box(x-2,0.65,z-1,3.4,.7,2.2,blue);
 box(x-2,1.05,z-1.85,3.2,.18,.25,mat(0xe8edf5));
 box(x+2.2,.45,z-1.5,1.5,.9,1.2,wood);
 box(x+2.2,1.4,z-1.85,1.4,1.1,.12,mat(0x252a30));
 // nightstand + lamp
 box(x+3.1,.45,z+.5,.8,.8,.8,wood); cyl(x+3.1,1.25,z+.5,.16,.45,mat(0xf4d27d));
 // TV
 box(x+2.1,1.8,z+1.9,2.2,1.25,.12,mat(0x1c252d));
 const room={x,z,n,state:"clean",trash:[]}; rooms.push(room);
}
[-7,7].forEach((x,side)=>[0].forEach(()=>{}));
makeRoom(-7,0,101); makeRoom(7,0,102);
makeRoom(-7,-9,103); makeRoom(7,-9,104);
makeRoom(-7,-18,105); makeRoom(7,-18,106);

// Lobby furniture
box(-7,.5,7,3.2,1,1.2,mat(0x5a3a2d)); box(7,.5,7,3.2,1,1.2,mat(0x5a3a2d));
cyl(-9,.8,8,.35,1.6,mat(0x39744d)); cyl(9,.8,8,.35,1.6,mat(0x39744d));

// player
const player=new THREE.Group(); scene.add(player);
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.9,6,12),mat(0xf0f0f0)); body.position.y=1.15; body.castShadow=true; player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.5,16,12),mat(0xd8a17c)); head.position.y=2.05; head.castShadow=true; player.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.52,16,8,0,Math.PI*2,0,Math.PI*.45),mat(0x3b251b)); hair.position.y=2.27; player.add(hair);
box(0,.62,0,.35,.8,.35,mat(0x3d4a58),player); // legs are approximate
player.position.set(0,0,11);

// guests
const guests=[];
const skinM=mat(0xd8a17c);
function person(type){
 const g=new THREE.Group();
 let shirt= type==="rich"?0x25282d:type==="family"?0xb75e50:0xd49a45;
 const b=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.75,6,10),mat(shirt));b.position.y=.95;b.castShadow=true;g.add(b);
 const h=new THREE.Mesh(new THREE.SphereGeometry(.43,14,10),skinM);h.position.y=1.75;h.castShadow=true;g.add(h);
 const hair=new THREE.Mesh(new THREE.SphereGeometry(.45,14,8,0,Math.PI*2,0,Math.PI*.45),mat(type==="rich"?0x222222:0x593a27));hair.position.y=1.95;g.add(hair);
 if(type==="rich") { const bag=box(.7,.7,0,.35,.7,.3,mat(0x292929)); g.add(bag); }
 if(type==="family"){ const child=new THREE.Group(); const cb=new THREE.Mesh(new THREE.CapsuleGeometry(.25,.45,5,8),mat(0x4d7dc1));cb.position.y=.65;child.add(cb);const ch=new THREE.Mesh(new THREE.SphereGeometry(.27,10,8),skinM);ch.position.y=1.18;child.add(ch);child.position.x=.75;child.position.z=.1;g.add(child);}
 scene.add(g);return g;
}
function spawnGuest(){
 if(guests.length>=8 || activeGuest) return;
 const r=Math.random(),type=r<.25?"rich":r<.65?"family":"tourist";
 const g=person(type);g.position.set((Math.random()-.5)*3,0,15);
 const obj={mesh:g,type,state:"toReception",room:null,stay:0};guests.push(obj);activeGuest=obj;
 document.getElementById('guests').textContent=guests.length;
 task.textContent=type==="rich"?"💎 A wealthy guest arrived.":"👥 Guests are arriving. Go to reception.";
}
let activeGuest=null;

// input
const keys={w:false,a:false,s:false,d:false}; let jx=0,jy=0;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k in keys)keys[k]=true;if(k==='e')interact()});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k in keys)keys[k]=false});
function interact(){
 if(activeGuest && activeGuest.state==="waiting"){
   if(player.position.distanceTo(new THREE.Vector3(0,0,4.5))<6){
    const r=rooms.find(x=>x.state==="clean");
    if(!r){task.textContent="No clean rooms. Clean one first.";return}
    activeGuest.room=r;activeGuest.state="toRoom";task.textContent="🛎️ Checked in. Follow the guest to Room "+r.n;
   }
   return;
 }
 const dirtyRoom=rooms.find(r=>r.state==="dirty");
 if(dirtyRoom){
   const item=dirtyRoom.trash.find(t=>!t.collected);
   if(item && player.position.distanceTo(item.pos)<1.5){
     item.collecting=true;item.start=performance.now();cleanItem=item;
     task.textContent="🧹 Stay on the item for 1.5 seconds.";
   }
 }
}

// joystick
const joy=document.getElementById('joystick'),knob=document.getElementById('knob');
function joyMove(e){const q=joy.getBoundingClientRect(),cx=q.left+q.width/2,cy=q.top+q.height/2,max=45;let dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy);if(l>max){dx=dx/l*max;dy=dy/l*max}knob.style.transform=`translate(${dx}px,${dy}px)`;jx=dx/max;jy=dy/max}
let dragging=false;joy.addEventListener('pointerdown',e=>{dragging=true;joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(dragging)joyMove(e)});['pointerup','pointercancel'].forEach(v=>joy.addEventListener(v,()=>{dragging=false;jx=jy=0;knob.style.transform='translate(0,0)'}));
document.getElementById('action').onclick=interact;

// simple collisions with room wall footprint, keeping door gaps
function canMove(nx,nz){
 if(nx<-21||nx>21||nz<-30||nz>15)return false;
 // reception
 if(nx>-4.3&&nx<4.3&&nz>3.4&&nz<5.7)return false;
 // room wall boxes, allow central door gap on front
 for(const r of rooms){
   const left=r.x-5,right=r.x+5,back=r.z-4,front=r.z+4;
   const inside=nx>left-.45&&nx<right+.45&&nz>back-.45&&nz<front+.45;
   if(!inside)continue;
   const inDoor=nz>front-.5&&nz<front+1&&nx>r.x-1.25&&nx<r.x+1.25;
   if(!inDoor)return false;
 }
 return true;
}
function updatePlayer(dt){
 let x=(keys.d?1:0)-(keys.a?1:0)+jx, z=(keys.s?1:0)-(keys.w?1:0)+jy;
 if(!x&&!z)return;
 const l=Math.hypot(x,z);x/=l;z/=l;
 const nx=player.position.x+x*6*dt,nz=player.position.z+z*6*dt;
 if(canMove(nx,player.position.z))player.position.x=nx;
 if(canMove(player.position.x,nz))player.position.z=nz;
}
function updateGuest(dt){
 if(!activeGuest)return;
 const g=activeGuest;
 let tx,tz;
 if(g.state==="toReception"||g.state==="waiting"){tx=0;tz=4.5}
 else if(g.state==="toRoom"){tx=g.room.x;tz=g.room.z+4.9}
 else if(g.state==="leaving"){tx=0;tz=16}
 else return;
 if(g.state==="toReception"||g.state==="toRoom"||g.state==="leaving"){
   const dx=tx-g.mesh.position.x,dz=tz-g.mesh.position.z,l=Math.hypot(dx,dz);
   if(l>.15){g.mesh.position.x+=dx/l*2.3*dt;g.mesh.position.z+=dz/l*2.3*dt}
   else if(g.state==="toReception"){g.state="waiting";task.textContent="🛎️ Guest is waiting. Go to reception and press Interact."}
   else if(g.state==="toRoom"){g.state="staying";g.stay=35;task.textContent="🛏️ Guest is enjoying Room "+g.room.n+" for 35 seconds."}
   else {scene.remove(g.mesh);activeGuest=null;guests=Math.max(0,guests-1);updateHUD();setTimeout(spawnGuest,3000)}
 } else if(g.state==="staying"){
   g.stay-=dt;
   // alternate natural actions by moving/rotating around furniture
   g.mesh.rotation.y+=dt*.3;
   if(g.stay<=0){
     g.room.state="dirty";
     g.room.trash=[
       {pos:new THREE.Vector3(g.room.x-2.4,.25,g.room.z+.4),icon:"can",collected:false,collecting:false},
       {pos:new THREE.Vector3(g.room.x+2,.25,g.room.z+.2),icon:"bag",collected:false,collecting:false},
       {pos:new THREE.Vector3(g.room.x-1,.25,g.room.z+2),icon:"bottle",collected:false,collecting:false},
       {pos:new THREE.Vector3(g.room.x+2.2,.25,g.room.z+2),icon:"cup",collected:false,collecting:false}
     ];
     g.state="leaving"; cash+=50; updateHUD(); task.textContent="💵 Guest paid $50. Enter the room and collect 4 pieces of trash.";
   }
 }
}
function updateHUD(){document.getElementById("money").textContent="$"+Math.floor(cash).toLocaleString();document.getElementById("guests").textContent=guests;document.getElementById("rooms").textContent=rooms.length;document.getElementById("rep").textContent=rep.toFixed(1)}
function makeTrashMeshes(){
 // updated each frame, emoji sprites
}
function spriteText(text){
 const cvs=document.createElement('canvas');cvs.width=128;cvs.height=128;const x=cvs.getContext('2d');x.font='72px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(text,64,64);
 const tex=new THREE.CanvasTexture(cvs);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));sp.scale.set(.8,.8,.8);return sp;
}
const trashSprites=new Map();
function updateTrash(){
 for(const r of rooms){
  if(!r.trash)continue;
  r.trash.forEach(t=>{
   if(t.collected){if(trashSprites.has(t)){scene.remove(trashSprites.get(t));trashSprites.delete(t)};return}
   if(!trashSprites.has(t)){
    const emoji=t.icon==="can"?"🥫":t.icon==="bag"?"🍟":t.icon==="bottle"?"🧃":"🥤";
    const sp=spriteText(emoji);sp.position.copy(t.pos);sp.position.y=.7;scene.add(sp);trashSprites.set(t,sp);
   }
   const sp=trashSprites.get(t);sp.scale.setScalar(t.collecting?.95:.8);
   if(t.collecting){
    if(player.position.distanceTo(t.pos)>1.5){t.collecting=false;task.textContent="Stay on the trash for 1.5 seconds."}
    else if(performance.now()-t.start>=1500){t.collected=true;t.collecting=false;const r2=rooms.find(q=>q.trash===r.trash);const n=r2.trash.filter(q=>q.collected).length;task.textContent="🧹 Trash collected: "+n+"/4";if(n===4){r.state="clean";task.textContent="✨ Room is clean! Another guest can be checked in.";phaseReset()}}
   }
  })
 }
}
function phaseReset(){activeGuest=null;setTimeout(spawnGuest,3000)}
function updateCamera(dt){
 const target=new THREE.Vector3(player.position.x,0,player.position.z);
 const desired=new THREE.Vector3(player.position.x+13,15,player.position.z+15);
 camera.position.lerp(desired,.09);camera.lookAt(target);
}
function animate(){
 requestAnimationFrame(animate);const dt=Math.min(.05,clock.getDelta());
 updatePlayer(dt);updateGuest(dt);updateTrash();updateCamera(dt);
 renderer.render(scene,camera);
}
const clock=new THREE.Clock();
setTimeout(spawnGuest,2500);
setInterval(()=>{if(!activeGuest)spawnGuest()},11000);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
animate();
</script>
</body>
</html>
