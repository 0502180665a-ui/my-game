<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open World Idle City Tycoon</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .phone-frame {
            width: 100%;
            max-width: 420px;
            background: #161b22;
            padding: 15px;
            border-radius: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 4px solid #30363d;
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            color: #58a6ff;
            font-size: 1.3rem;
            margin: 5px 0;
        }
        .container {
            background: #21262d;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .stats {
            font-size: 0.9rem;
            background: #30363d;
            padding: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-around;
        }
        /* Canvas Map View */
        #gameMap {
            background: #090d12;
            border-radius: 8px;
            border: 2px solid #30363d;
            display: block;
            margin: 0 auto 10px auto;
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            margin: 3px;
            font-weight: bold;
        }
        button:hover { background-color: #2ea043; }
        button:disabled { background-color: #484f58; color: #8b949e; cursor: not-allowed; }
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-top: 5px;
        }
        .controls-grid button { width: 100%; padding: 12px; font-size: 1.1rem; }
        .empty-space { background: transparent; border: none; cursor: default; }
        #message {
            color: #d29922;
            font-size: 0.85rem;
            font-weight: bold;
            min-height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .shop-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #30363d;
            padding: 8px;
            margin: 5px 0;
            border-radius: 6px;
            font-size: 0.85rem;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <h1>Open World City Tycoon</h1>
        <div id="message">Use Joystick/Arrows to explore the city & enter buildings!</div>
        
        <div class="container stats">
            <div>Cash: <b>$<span id="money">0</span></b></div>
            <div>Income: <b>$<span id="cps">0</span>/s</b></div>
            <div>Vehicle: <span id="vehicle-name">Walking</span></div>
        </div>

        <!-- Canvas for Game World -->
        <canvas id="gameMap" width="380" height="200"></canvas>

        <!-- Movement Controls for Mobile -->
        <div class="container">
            <div class="controls-grid">
                <div class="empty-space"></div>
                <button onclick="movePlayer(0, -1)">⬆️</button>
                <div class="empty-space"></div>
                <button onclick="movePlayer(-1, 0)">⬅️</button>
                <button onclick="interact()">⭐ Action</button>
                <button onclick="movePlayer(1, 0)">➡️</button>
                <div class="empty-space"></div>
                <button onclick="movePlayer(0, 1)">⬇️</button>
                <div class="empty-space"></div>
            </div>
        </div>

        <!-- Dynamic Interaction Panel -->
        <div id="action-panel" class="container">
            <h3 id="panel-title" style="margin: 5px 0; color: #58a6ff; font-size: 1rem;">Explore the Map</h3>
            <div id="panel-content">Walk to locations like the Pier, Office, Car Wash, or Car Shop!</div>
        </div>

        <!-- Business & Empire Panel -->
        <div class="container">
            <h3 style="margin: 5px 0; color: #3fb950; font-size: 1rem;">Empire & Transport</h3>
            <div id="empire-list"></div>
        </div>
    </div>

    <script>
        let game = {
            money: 10,
            cps: 0,
            x: 5,
            y: 5,
            speed: 1,
            vehicle: 'walking', // walking, bike, car
            businesses: { kiosk: 0, factory: 0 },
            properties: { newTown: 0 }
        };

        // Map layout elements (Grid 10x10)
        // Locations: 0=Road, 1=Pier (Fisherman), 2=Office, 3=CarWash, 4=CarShop, 5=RealEstate
        const locations = {
            "1,1": { name: "Ocean Pier (Fisherman Job)", type: "job", jobName: "Fisherman", pay: 2, desc: "Catch fish for cash!" },
            "8,2": { name: "Corporate Office", type: "job", jobName: "Office Worker", pay: 6, desc: "Paperwork and spreadsheets." },
            "2,8": { name: "City Car Wash", type: "job", jobName: "Car Cleaner", pay: 10, desc: "Wash vehicles to earn money." },
            "8,8": { name: "Vehicle Dealership", type: "shop", item: "car", cost: 500, desc: "Buy a Car to move faster!" },
            "5,5": { name: "New Town Construction", type: "city", item: "newTown", cost: 5000, desc: "Build your own satellite city!" }
        };

        const canvas = document.getElementById("gameMap");
        const ctx = canvas.getContext("2d");

        function drawMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let tileSize = 38;

            // Draw grid and spots
            for (let rx = 0; rx < 10; rx++) {
                for (let ry = 0; ry < 10; ry++) {
                    ctx.fillStyle = "#161b22";
                    ctx.fillRect(rx * tileSize + 2, ry * tileSize + 2, tileSize - 4, tileSize - 4);

                    let key = `${rx},${ry}`;
                    if (locations[key]) {
                        ctx.fillStyle = locations[key].type === 'job' ? '#1f6feb' : (locations[key].type === 'shop' ? '#8957e5' : '#f85149');
                        ctx.fillRect(rx * tileSize + 6, ry * tileSize + 6, tileSize - 12, tileSize - 12);
                    }
                }
            }

            // Draw Player
            ctx.fillStyle = "#3fb950";
            ctx.beginPath();
            ctx.arc(game.x * tileSize + 19, game.y * tileSize + 19, 10, 0, Math.PI * 2);
            ctx.fill();
        }

        function movePlayer(dx, dy) {
            let newX = game.x + (dx * game.speed);
            let newY = game.y + (dy * game.speed);
            if (newX >= 0 && newX < 10 && newY >= 0 && newY < 10) {
                game.x = newX;
                game.y = newY;
                checkLocation();
                drawMap();
            }
        }

        // Keyboard controls support
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') movePlayer(0, -1);
            if (e.key === 'ArrowDown' || e.key === 's') movePlayer(0, 1);
            if (e.key === 'ArrowLeft' || e.key === 'a') movePlayer(-1, 0);
            if (e.key === 'ArrowRight' || e.key === 'd') movePlayer(1, 0);
            if (e.key === 'e' || e.key === 'Enter') interact();
        });

        function checkLocation() {
            let key = `${game.x},${game.y}`;
            let panelTitle = document.getElementById('panel-title');
            let panelContent = document.getElementById('panel-content');

            if (locations[key]) {
                let loc = locations[key];
                panelTitle.innerText = loc.name;
                panelContent.innerHTML = `${loc.desc}<br><button onclick="interact()">Interact / Work</button>`;
            } else {
                panelTitle.innerText = "Streets of Open City";
                panelContent.innerHTML = "Explore the map to find Jobs, Car Shops, and City Building zones!";
            }
        }

        function interact() {
            let key = `${game.x},${game.y}`;
            let loc = locations[key];
            if (!loc) {
                document.getElementById('message').innerText = "Nothing to do here. Walk to colored blocks!";
                return;
            }

            if (loc.type === 'job') {
                game.money += loc.pay;
                document.getElementById('message').innerText = `Worked as ${loc.jobName}! Earned +$${loc.pay}`;
                updateUI();
            } else if (loc.type === 'shop' && loc.item === 'car') {
                if (game.money >= loc.cost && game.vehicle === 'walking') {
                    game.money -= loc.cost;
                    game.vehicle = 'car';
                    game.speed = 2; // Move faster!
                    document.getElementById('vehicle-name').innerText = "Sports Car";
                    document.getElementById('message').innerText = "Purchased a Car! You now move 2 blocks at a time.";
                    updateUI();
                } else {
                    document.getElementById('message').innerText = "Already bought or not enough cash ($500 needed)!";
                }
            } else if (loc.type === 'city') {
                if (game.money >= loc.cost) {
                    game.money -= loc.cost;
                    game.properties.newTown++;
                    game.cps += 50;
                    loc.cost = Math.floor(loc.cost * 1.5);
                    document.getElementById('message').innerText = "Built a district in your new city! +$50/sec";
                    updateUI();
                } else {
                    document.getElementById('message').innerText = "Building a city requires $5,000!";
                }
            }
        }

        function updateUI() {
            document.getElementById('money').innerText = Math.floor(game.money).toLocaleString();
            document.getElementById('cps').innerText = game.cps.toLocaleString();
            
            let empireHTML = `<div class="shop-row"><span>New Town Districts: ${game.properties.newTown}</span><span>+$50/s</span></div>`;
            if (game.vehicle === 'car') {
                empireHTML += `<div class="shop-row"><span>Transport: Sports Car</span><span>Active</span></div>`;
            }
            document.getElementById('empire-list').innerHTML = empireHTML;
        }

        // Idle income tick
        setInterval(() => {
            if (game.cps > 0) {
                game.money += game.cps / 10;
                updateUI();
            }
        }, 100);

        drawMap();
        updateUI();
    </script>
</body>
</html>
